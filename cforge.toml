# =========================================================
# AP2 - Application Primitives
# =========================================================

[project]
name = "ap2"
version = "0.1.0"
description = "Application Primitives — a C17 kit for games and tools"
authors = ["Jack Waechter"]
license = "MIT"

binary_type = "executable"

# Debug (`cforge build` / `python ap2_product.py`): sample app
# Release (`cforge build --config Release` / `python ap2_product.py -c Release`): lib
# See ap2_product.py

c_standard = "17"
cpp_standard = "17"

# =========================================================
# Build
# =========================================================

[build]
build_type = "Debug"
directory = "build"

source_dirs = ["src", "src/core", "src/examples"]

include_dirs = [
    "include",
    "include/AP2",
    "third_party/stb",
    "third_party/miniaudio",
]

export_compile_commands = true

# =========================================================
# CMake
# =========================================================

[cmake]
# Must match cforge run's Windows default. `cforge build` honors this key, but
# `cforge run` ignores it and always passes -G "Ninja Multi-Config". Pinning
# anything else (e.g. "Ninja") makes the next `cforge run` fail against the cache.
generator = "Ninja Multi-Config"
c_compiler = "C:/msys64/ucrt64/bin/gcc.exe"
cxx_compiler = "C:/msys64/ucrt64/bin/g++.exe"
inject_before_target = '''
set(AP2_APP_TARGET ap2_app)
set(PROJECT_NAME "${AP2_APP_TARGET}")
'''
inject_after_target = '''
cmake_language(DEFER CALL include "${CMAKE_CURRENT_SOURCE_DIR}/cmake/ap2-product.cmake")
'''

[build.cmake_variables]
CMAKE_C_COMPILER = "C:/msys64/ucrt64/bin/gcc.exe"
CMAKE_CXX_COMPILER = "C:/msys64/ucrt64/bin/g++.exe"
CMAKE_RC_COMPILER = "C:/msys64/ucrt64/bin/windres.exe"
CMAKE_C_COMPILER_WORKS = "TRUE"
CMAKE_CXX_COMPILER_WORKS = "TRUE"
CMAKE_DEPENDS_USE_COMPILER = "FALSE"
CMAKE_NINJA_FORCE_RESPONSE_FILE = "ON"
CMAKE_C_FLAGS = "-B C:/msys64/ucrt64/bin"
CMAKE_CXX_FLAGS = "-B C:/msys64/ucrt64/bin"

# =========================================================
# Debug
# =========================================================

[build.config.debug]
optimize = ""
debug_info = true
warnings = "all"

defines = ["DEBUG=1", "_CRT_SECURE_NO_WARNINGS"]

# =========================================================
# Release
# =========================================================

[build.config.release]
optimize = "speed"
debug_info = false
warnings = "all"
lto = true

defines = ["NDEBUG", "_CRT_SECURE_NO_WARNINGS"]

# =========================================================
# RelWithDebInfo
# =========================================================

[build.config.relwithdebinfo]
optimize = "speed"
debug_info = true
warnings = "all"

defines = ["NDEBUG", "_CRT_SECURE_NO_WARNINGS"]

# =========================================================
# MinSizeRel
# =========================================================

[build.config.minsizerel]
optimize = "size"
debug_info = false
warnings = "all"

defines = ["NDEBUG", "_CRT_SECURE_NO_WARNINGS"]

# =========================================================
# MSVC
# =========================================================

[compiler.msvc]
warnings = "all"

defines = ["_CRT_SECURE_NO_WARNINGS"]

# =========================================================
# Windows
# =========================================================

[platform.windows]
defines = ["WIN32", "_WINDOWS"]

links = ["user32", "kernel32", "opengl32", "gdi32", "advapi32", "shell32"]

[platform.linux]
links = ["GL", "dl", "m", "pthread"]

[platform.macos]
defines = ["GL_SILENCE_DEPRECATION"]

# =========================================================
# Dependencies
# =========================================================

[dependencies]
glad = "2.0.8"
glfw = "3.5.1"

# =========================================================
# Tests
# =========================================================

[test]
enabled = false

# =========================================================
# Packaging
# =========================================================

[package]
enabled = true
generators = []

vendor = "Jack Waechter"
contact = "Jack Waechter"

# =========================================================
# Hot Reload
# =========================================================

[hot_reload]
enabled = true

host = "src/main.c"
module = "src/main.c"

entry_point = "main"

watch_dirs = ["src", "include"]
