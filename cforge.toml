# Project configuration for ap2

[project]
name = "ap2"
version = "0.1.0"
description = "A C project created with cforge"
cpp_standard = "17"
c_standard = "11"
binary_type = "executable"  # executable, shared_lib, static_lib, or header_only
authors = ["Your Name <your.email@example.com>"]
homepage = "https://github.com/yourusername/ap2"
repository = "https://github.com/yourusername/ap2.git"
license = "MIT"

[build]
build_type = "Debug"  # Debug, Release, RelWithDebInfo, MinSizeRel
directory = "build"
source_dirs = ["src", "src/core"]
include_dirs = ["include"]
export_compile_commands = true  # Generate compile_commands.json for IDEs
# position_independent_code = true  # For shared libraries
# Uncomment to specify custom source patterns
# source_patterns = ["src/*.cpp", "src/**/*.cpp"]
# Uncomment to specify individual source files
# source_files = ["src/main.cpp", "src/example.cpp"]

[build.config.debug]
optimize = "debug"      # Portable: maps to /Od (MSVC) or -Og (GCC/Clang)
debug_info = true        # Portable: maps to /Zi (MSVC) or -g (GCC/Clang)
warnings = "all"        # Portable: maps to /W4 (MSVC) or -Wall -Wextra (GCC/Clang)
defines = ["DEBUG=1"]
# sanitizers = ["address"]  # Enable AddressSanitizer for debug builds

[build.config.release]
optimize = "speed"      # Portable: maps to /O2 (MSVC) or -O2 (GCC/Clang)
warnings = "all"        # Portable: maps to /W4 (MSVC) or -Wall -Wextra (GCC/Clang)
lto = true              # Link-time optimization: /GL+/LTCG (MSVC) or -flto (GCC/Clang)
defines = ["NDEBUG"]

[build.config.relwithdebinfo]
optimize = "speed"
debug_info = true
warnings = "all"
defines = ["NDEBUG"]

[build.config.minsizerel]
optimize = "size"       # Portable: maps to /O1 /Os (MSVC) or -Os (GCC/Clang)
defines = ["NDEBUG"]

[test]
enabled = false
[package]
enabled = true
generators = []  # Package generators
# Windows generators: ZIP, NSIS
# Linux generators: TGZ, DEB, RPM
# macOS generators: TGZ
vendor = "Your Organization"
contact = "Your Name <your.email@example.com>"

