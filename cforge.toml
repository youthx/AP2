# =========================================================
# AP2 - Aphelion Engine Core
# =========================================================

[project]
name = "ap2"
version = "0.1.0"
description = "Aphelion Engine core library"
authors = ["Jack Waechter"]
license = "MIT"

binary_type = "executable"

c_standard = "17"
cpp_standard = "17"


# =========================================================
# Build
# =========================================================

[build]
build_type = "Debug"
directory = "build"

source_dirs = [
    "src",
    "src/core"
]

include_dirs = [
    "include"
]

export_compile_commands = true


# =========================================================
# Debug
# =========================================================

[build.config.debug]
optimize = ""
debug_info = true
warnings = "all"

defines = [
    "DEBUG=1",
    "_CRT_SECURE_NO_WARNINGS"
]


# =========================================================
# Release
# =========================================================

[build.config.release]
optimize = "speed"
debug_info = false
warnings = "all"
lto = true

defines = [
    "NDEBUG",
    "_CRT_SECURE_NO_WARNINGS"
]


# =========================================================
# RelWithDebInfo
# =========================================================

[build.config.relwithdebinfo]
optimize = "speed"
debug_info = true
warnings = "all"

defines = [
    "NDEBUG",
    "_CRT_SECURE_NO_WARNINGS"
]


# =========================================================
# MinSizeRel
# =========================================================

[build.config.minsizerel]
optimize = "size"
debug_info = false
warnings = "all"

defines = [
    "NDEBUG",
    "_CRT_SECURE_NO_WARNINGS"
]


# =========================================================
# MSVC
# =========================================================

[compiler.msvc]
warnings = "all"

defines = [
    "_CRT_SECURE_NO_WARNINGS"
]


# =========================================================
# Windows
# =========================================================

[platform.windows]
defines = [
    "WIN32",
    "_WINDOWS"
]

links = [
    "user32",
    "kernel32"
]


# =========================================================
# Dependencies
# =========================================================


[dependencies]
glad = "2.0.8"
glfw = "3.5.1"

[dependencies.system.OpenGL]
method = "manual"
libraries = ["opengl32"]

# =========================================================
# Tests
# =========================================================

[test]
enabled = false


# =========================================================
# Packaging
# =========================================================

[package]
enabled = true
generators = []

vendor = "Aphelion Engine"
contact = "Jack Waechter"


# =========================================================
# Hot Reload
# =========================================================

[hot_reload]
enabled = true

host = "src/main.c"
module = "src/main.c"

entry_point = "main"

watch_dirs = [
    "src",
    "include"
]
