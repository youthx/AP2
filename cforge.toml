# Platform-specific configuration
# Portable options: optimize, warnings, debug_info, sanitizers, lto,
#                   exceptions, rtti, hardening, visibility
# [platform.windows]
# hardening = "full"      # Portable: /GS /sdl /GUARD:CF (MSVC)
# defines = ["WIN32", "_WINDOWS"]
# links = ["kernel32", "user32"]
#
# [platform.linux]
# hardening = "basic"     # Portable: -fstack-protector-strong -D_FORTIFY_SOURCE=2
# defines = ["LINUX"]
# links = ["pthread", "dl"]
#
# [platform.macos]
# stdlib = "libc++"       # Portable: use libc++ on macOS
# defines = ["MACOS"]
# frameworks = ["Cocoa", "IOKit"]

# Compiler-specific configuration
# Portable options work here too - they translate to the right flags
# [compiler.msvc]
# warnings = "strict"     # Portable: /W4 /WX
# defines = ["_CRT_SECURE_NO_WARNINGS"]
#
# [compiler.gcc]
# warnings = "pedantic"   # Portable: -Wall -Wextra -Wpedantic -Werror
#
# [compiler.clang]
# warnings = "pedantic"   # Portable: -Wall -Wextra -Wpedantic -Werror
#
# [compiler.mingw]
# warnings = "all"        # Portable: -Wall -Wextra
# defines = ["MINGW"]

# Platform + Compiler combination
# [platform.windows.compiler.msvc]
# flags = ["/W4"]
# defines = ["_CRT_SECURE_NO_WARNINGS"]

# Cross-compilation (optional)
# [cross]
# enabled = true
#
# [cross.target]
# system = "Linux"           # CMAKE_SYSTEM_NAME
# processor = "aarch64"      # CMAKE_SYSTEM_PROCESSOR
# toolchain = "path/to/toolchain.cmake"  # Optional
#
# [cross.compilers]
# c = "/usr/bin/aarch64-linux-gnu-gcc"
# cxx = "/usr/bin/aarch64-linux-gnu-g++"
#
# [cross.paths]
# sysroot = "/path/to/sysroot"
# find_root = "/path/to/find/root"
#
# [cross.variables]  # Custom CMake variables
# ANDROID_ABI = "arm64-v8a"
#
# Cross-compilation profiles (use with: cforge build --profile <name>)
# [cross.profile.android-arm64]
# system = "Android"
# processor = "aarch64"
# toolchain = "${ANDROID_NDK}/build/cmake/android.toolchain.cmake"
# variables = { ANDROID_ABI = "arm64-v8a", ANDROID_PLATFORM = "android-24" }
#
# [cross.profile.raspberry-pi]
# system = "Linux"
# processor = "armv7l"
# compilers = { c = "arm-linux-gnueabihf-gcc", cxx = "arm-linux-gnueabihf-g++" }
